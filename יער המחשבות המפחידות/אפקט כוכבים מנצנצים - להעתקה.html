<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אפקט כוכבים מנצנצים + גחליליות — להעתקה</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0b0a1c; }

  /* ========================================================= */
  /*  ⭐ אפקט כוכבים מנצנצים + גחליליות — העתק את בלוק ה־@keyframes  */
  /*     ואת השכבות שבתוך .starfield אל הפרויקט שלך.               */
  /* ========================================================= */

  @keyframes twinkle  { 0%,100%{ opacity:.3; }  50%{ opacity:.9; } }
  @keyframes twinkleB { 0%,100%{ opacity:.15; } 45%{ opacity:1; } }
  @keyframes twinkleC { 0%,100%{ opacity:.55; } 30%{ opacity:.1; } 65%{ opacity:1; } }
  @keyframes firefly  { 0%{ transform:translate(0,0); opacity:.15; } 25%{ opacity:.85; } 50%{ transform:translate(16px,-20px); opacity:.4; } 75%{ opacity:.8; } 100%{ transform:translate(0,0); opacity:.15; } }

  /* האזור המארח — חייב position:relative + overflow:hidden + רקע כהה */
  .starfield {
    position: relative;
    overflow: hidden;
    min-height: 520px;
    background: radial-gradient(120% 100% at 50% 0%, #241f4d 0%, #14112e 55%, #0b0a1c 100%);
  }

  /* כל שכבות האפקט — לא לוכדות לחיצות */
  .starfield .stars,
  .starfield .fireflies { position: absolute; inset: 0; pointer-events: none; }
  .starfield .fireflies { overflow: hidden; }

  .starfield .fly { position: absolute; width: 6px; height: 6px; border-radius: 50%; }

  /* התוכן האמיתי — מעל השכבות */
  .starfield .content { position: relative; z-index: 2; text-align: center; color: #F6EEDC; padding: 90px 24px; }
  .starfield .content h1 { font-size: 40px; margin: 0 0 12px; }
  .starfield .content p  { font-size: 17px; opacity: .8; margin: 0; }
</style>
</head>
<body>

  <section class="starfield">

    <!-- ⭐ שכבה 1 של כוכבים — לבן/קרם, קצב איטי -->
    <div class="stars" style="
      background-image:
        radial-gradient(2px 2px at 40px 60px, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 160px 130px, rgba(255,255,255,.6), transparent),
        radial-gradient(1px 1px at 100px 220px, rgba(255,255,255,.5), transparent),
        radial-gradient(2px 2px at 250px 90px, rgba(255,255,255,.7), transparent),
        radial-gradient(1px 1px at 320px 200px, rgba(244,236,218,.6), transparent);
      background-size: 360px 300px;
      animation: twinkle 5s ease-in-out infinite;"></div>

    <!-- ⭐ שכבה 2 — טורקיז/סגול, קצב מהיר יותר + עיכוב -->
    <div class="stars" style="
      background-image:
        radial-gradient(1.5px 1.5px at 210px 40px, rgba(255,255,255,.85), transparent),
        radial-gradient(1px 1px at 60px 160px, rgba(200,182,242,.7), transparent),
        radial-gradient(2px 2px at 300px 250px, rgba(255,255,255,.8), transparent),
        radial-gradient(1px 1px at 130px 300px, rgba(143,224,208,.6), transparent);
      background-size: 340px 340px;
      animation: twinkleB 3.4s ease-in-out infinite .8s;"></div>

    <!-- ⭐ שכבה 3 — קרם/צהוב, קצב שלישי + עיכוב -->
    <div class="stars" style="
      background-image:
        radial-gradient(1px 1px at 190px 210px, rgba(255,255,255,.9), transparent),
        radial-gradient(1.5px 1.5px at 30px 280px, rgba(247,216,115,.7), transparent),
        radial-gradient(1px 1px at 280px 150px, rgba(255,255,255,.7), transparent);
      background-size: 320px 320px;
      animation: twinkleC 4.6s ease-in-out infinite .3s;"></div>

    <!-- ✨ גחליליות זוהרות צפות — כל אחת בצבע, משך ועיכוב שונים -->
    <div class="fireflies">
      <span class="fly" style="top: 70px;  left: 10%; background:#F7D873; box-shadow:0 0 12px 3px rgba(247,216,115,.75); animation: firefly 9s  ease-in-out infinite;"></span>
      <span class="fly" style="top: 160px; left: 84%; background:#8FE0D0; box-shadow:0 0 11px 3px rgba(143,224,208,.7);  animation: firefly 11s ease-in-out infinite 1.2s;"></span>
      <span class="fly" style="bottom: 90px; left: 18%; background:#F0A95E; box-shadow:0 0 12px 3px rgba(240,169,94,.7);  animation: firefly 10s ease-in-out infinite .6s;"></span>
      <span class="fly" style="top: 120px; left: 66%; background:#C8B6F2; box-shadow:0 0 11px 3px rgba(200,182,242,.7);  animation: firefly 12s ease-in-out infinite 2.2s;"></span>
    </div>

    <!-- התוכן שלך מעל האפקט -->
    <div class="content">
      <h1>הכותרת שלך כאן</h1>
      <p>כל הטקסט מונח מעל שכבות האפקט (z-index:2).</p>
    </div>

  </section>

</body>
</html>
