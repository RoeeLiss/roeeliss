  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ext-decoration: none; white-space: nowrap; flex-shrink: 0;\">לשריין מקום<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 1: HERO -->\n  <section data-screen-label=\"Hero\" style=\"background: #FFFFFF; padding: 72px 32px 64px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center; max-width: 1180px; margin: 0 auto;\">\n    <div>\n      <div style=\"display: inline-block; background: #EDF3FA; color: #2E5C8A; font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 999px; margin-bottom: 20px;\">סדנת PlayLiss למטפלים<\u002Fdiv>\n      <h1 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 48px; line-height: 1.2; color: #2E5C8A; margin: 0 0 20px;\">עוצרים את הר הכעס<\u002Fh1>\n      <p style=\"font-size: 20px; line-height: 1.6; color: #2F3A47; margin: 0 0 24px;\">הופכים משחקים מוכרים שילדים אוהבים לכלי טיפול ואימון יעילים בניהול כעסים וויסות רגשי<\u002Fp>\n\n      <div style=\"display: flex; flex-wrap: wrap; gap: 10px 20px; font-size: 15px; color: #2F3A47; margin-bottom: 32px;\">\n        <span style=\"display:flex; align-items:center; gap:6px;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M15 10l4.5 2.5-4.5 2.5M4 12a8 8 0 1116 0 8 8 0 01-16 0z\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>יום מרוכז, שני מפגשים<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:6px;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"5\" width=\"18\" height=\"16\" rx=\"2\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Frect><path d=\"M3 9h18M8 3v4M16 3v4\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>שלישי, 11 באוגוסט<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:6px;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"12\" r=\"9\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M12 7v5l3 3\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>12:00–13:30 ו-14:00–15:30<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:6px;\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><rect x=\"3\" y=\"6\" width=\"14\" height=\"12\" rx=\"2\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Frect><path d=\"M17 10l4-2.5v9L17 14\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>כולל הקלטה ל-60 יום<\u002Fspan>\n        <span style=\"font-weight: 700; color: #2E5C8A;\">₪199 במכירה מוקדמת (מחיר מלא ₪249)<\u002Fspan>\n      <\u002Fdiv>\n\n      <a href=\"#signup\" style=\"display: inline-block; background: #3E8E9E; color: #FFFFFF; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 999px; text-decoration: none;\" style-hover=\"background: #357c8a;\">לשריין מקום בסדנת הקיץ<\u002Fa>\n      <div style=\"font-size: 14px; color: #4A7FB5; margin-top: 14px;\">מפי מחבר הספר \"הר הכעס\"<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"position: relative;\">\n      <div style=\"border-radius: 20px; overflow: hidden; box-shadow: 0 20px 50px -20px rgba(46,92,138,0.35);\">\n        <image-slot id=\"hero-workshop-image\" shape=\"rect\" style=\"width: 100%; height: 420px;\" placeholder=\"תמונת הסדנה — עוצרים את הר הכעס\"><\u002Fimage-slot>\n      <\u002Fdiv>\n      <div style=\"position: absolute; bottom: -18px; right: -18px; display: flex; gap: 10px; background: #FFFFFF; padding: 10px; border-radius: 16px; box-shadow: 0 12px 30px -12px rgba(46,92,138,0.3);\">\n        <img src=\"c5318f41-80d6-4d8e-a900-5c030d62cdf1\" alt=\"טאקי\" style=\"width: 56px; height: 56px; border-radius: 10px; object-fit: cover;\">\n        <img src=\"9a159eee-469b-4a64-84bf-da173f8ac402\" alt=\"מלך הפלאפל\" style=\"width: 56px; height: 56px; border-radius: 10px; object-fit: cover;\">\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 2: INTRO -->\n  <section data-screen-label=\"Intro\" style=\"background: #FDFCFA; padding: 80px 32px;\">\n    <div style=\"max-width: 760px; margin: 0 auto; text-align: center;\">\n      <p style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 24px; line-height: 1.5; color: #2E5C8A; margin: 0 0 28px;\">\n        מה הופך דוקים לכלי כל כך יעיל בטיפול באימפולסיביות? איך משחקים את קלף ה-2+ בטאקי כדי להגמיש הטיות חשיבה של עוינות? ומה הקשר בין ארבע בשורה לוויסות רגשי?\n      <\u002Fp>\n      <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 20px;\">\n        כמטפלים ואנשי חינוך, אנחנו פוגשים כמעט בכל יום ילדים שמתפרצים בעת כעס ומתמודדים עם קשיים בוויסות רגשי. לעיתים קרובות, הכעס, ההתנגדות ואי-הציות שמאפיינים את הילדים האלה מופנים כלפינו וכלפי הטיפול עצמו — והופכים את מלאכת הטיפול לקשה ומאתגרת במיוחד.\n      <\u002Fp>\n      <p style=\"font-size: 18px; line-height: 1.7; margin: 0;\">\n        כאשר משתמשים בהם באופן מושכל ומדויק, משחקים מוכרים דוגמת טאקי ומלך הפלאפל יכולים להיות כלים טיפוליים יעילים ומהנים בטיפול קוגניטיבי-התנהגותי באמצעות משחק (CBPT). בסדנה \"עוצרים את הר הכעס!\" נכיר את הכעס מקרוב, נבין כיצד מגייסים את המוטיבציה של המטופלים דרך משחקים מוכרים — ובעיקר נלמד לשלב אותם ככלים טיפוליים במפגשים פרטניים, קבוצתיים ובהדרכות הורים.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 3: QUOTE SPOTLIGHT -->\n  <section data-screen-label=\"Quote\" style=\"background: #EDF3FA; padding: 80px 32px;\">\n    <div style=\"max-width: 720px; margin: 0 auto; text-align: center; position: relative;\">\n      <div style=\"font-family: Georgia, serif; font-size: 80px; color: #B8CFE5; line-height: 0.5; margin-bottom: 12px;\">\"<\u002Fdiv>\n      <p style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; line-height: 1.5; color: #2E5C8A; margin: 0 0 24px;\">\n        מזה כ-15 שנים אני עוסק בהתערבויות עם ילדים ומתבגרים עם הפרעת קשב, קשיי התנהגות והתנהגויות סיכון — הקורס הזה עשה לי סדר!\n      <\u002Fp>\n      <div style=\"font-size: 16px; color: #4A7FB5; font-weight: 600;\">יותם ויסקופ (.Ed.M)<\u002Fdiv>\n      <div style=\"font-size: 15px; color: #2F3A47;\">מתמחה בתחום הפרעות התנהגות ולקויות למידה<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 4: WHO IT'S FOR -->\n  <section data-screen-label=\"Who it's for\" style=\"background: #FFFFFF; padding: 80px 32px;\">\n    <div style=\"max-width: 780px; margin: 0 auto; text-align: center;\">\n      <div style=\"display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; margin-bottom: 32px;\">\n        <span style=\"display:flex; align-items:center; gap:8px; border: 1px solid #B8CFE5; border-radius: 999px; padding: 10px 22px; font-size: 16px; font-weight: 600; color: #2E5C8A;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M4 20c0-4 3.5-6 8-6s8 2 8 6\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>פסיכולוגים<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:8px; border: 1px solid #B8CFE5; border-radius: 999px; padding: 10px 22px; font-size: 16px; font-weight: 600; color: #2E5C8A;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M4 20c0-4 3.5-6 8-6s8 2 8 6\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>מטפלים<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:8px; border: 1px solid #B8CFE5; border-radius: 999px; padding: 10px 22px; font-size: 16px; font-weight: 600; color: #2E5C8A;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M4 20c0-4 3.5-6 8-6s8 2 8 6\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>עובדים סוציאליים<\u002Fspan>\n        <span style=\"display:flex; align-items:center; gap:8px; border: 1px solid #B8CFE5; border-radius: 999px; padding: 10px 22px; font-size: 16px; font-weight: 600; color: #2E5C8A;\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><circle cx=\"12\" cy=\"8\" r=\"4\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fcircle><path d=\"M4 20c0-4 3.5-6 8-6s8 2 8 6\" stroke=\"#4A7FB5\" stroke-width=\"1.8\"><\u002Fpath><\u002Fsvg>אנשי חינוך<\u002Fspan>\n      <\u002Fdiv>\n      <p style=\"font-size: 20px; line-height: 1.6; color: #2E5C8A; font-weight: 600; margin: 0;\">\n        אם יש לכם מטופל אחד שההתפרצויות שלו מגיעות גם אליכם לחדר — הסדנה הזאת בשבילכם.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 5: WHAT WE'LL LEARN — DARK -->\n  <section data-screen-label=\"Two sessions\" style=\"background: #2E5C8A; padding: 88px 32px;\">\n    <div style=\"max-width: 1080px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 34px; line-height: 1.4; color: #FFFFFF; text-align: center; margin: 0 0 48px;\">יום מרוכז, שני מפגשים. מהיכרות עם הכעס — ועד המשחק שעל השולחן.<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 28px;\">\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 36px;\">\n          <div style=\"font-size: 14px; font-weight: 700; color: #3E8E9E; margin-bottom: 8px;\">מפגש ראשון<\u002Fdiv>\n          <h3 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 22px; color: #2E5C8A; margin: 0 0 20px;\">מכירים את הכעס מקרוב<\u002Fh3>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px;\">\n            <li style=\"font-size: 17px; line-height: 1.6; padding-right: 20px; position: relative;\"><span style=\"position:absolute; right:0; top: 10px; width:6px; height:6px; border-radius:50%; background:#4A7FB5;\"><\u002Fspan>מתי הכעס נדלק, מה הוא מספר לנו, ואיך מבחינים בינו לבין מצבים מנטליים דומים<\u002Fli>\n            <li style=\"font-size: 17px; line-height: 1.6; padding-right: 20px; position: relative;\"><span style=\"position:absolute; right:0; top: 10px; width:6px; height:6px; border-radius:50%; background:#4A7FB5;\"><\u002Fspan>איך מגייסים מוטיבציה לטיפול אצל ילדים שמפנים את ההתנגדות גם כלפינו<\u002Fli>\n            <li style=\"font-size: 17px; line-height: 1.6; padding-right: 20px; position: relative;\"><span style=\"position:absolute; right:0; top: 10px; width:6px; height:6px; border-radius:50%; background:#4A7FB5;\"><\u002Fspan>עקרונות מרכזיים מתוך פרוטוקולים מבוססי מחקר לניהול כעסים, ויסות רגשי ופתרון בעיות בילדים ובני נוער<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 36px;\">\n          <div style=\"font-size: 14px; font-weight: 700; color: #3E8E9E; margin-bottom: 8px;\">מפגש שני<\u002Fdiv>\n          <h3 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 22px; color: #2E5C8A; margin: 0 0 20px;\">המשחקים נכנסים לחדר<\u002Fh3>\n          <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px;\">\n            <li style=\"font-size: 17px; line-height: 1.6; padding-right: 20px; position: relative;\"><span style=\"position:absolute; right:0; top: 10px; width:6px; height:6px; border-radius:50%; background:#4A7FB5;\"><\u002Fspan>הטמעת משחקים מוכרים — דוקים, טאקי, מלך הפלאפל, ארבע בשורה ועוד — במודולות הטיפול בניהול כעסים<\u002Fli>\n            <li style=\"font-size: 17px; line-height: 1.6; padding-right: 20px; position: relative;\"><span style=\"position:absolute; right:0; top: 10px; width:6px; height:6px; border-radius:50%; background:#4A7FB5;\"><\u002Fspan>אילו משחקים רלוונטיים לאילו מטרות: שליטה באימפולסיביות, הרפיה ושליטה גופנית, הגמשת הטיות חשיבה של עוינות<\u002Fli>\n            <li style=\"font-size: 17px; line-height: 1.6; padding-right: 20px; position: relative;\"><span style=\"position:absolute; right:0; top: 10px; width:6px; height:6px; border-radius:50%; background:#4A7FB5;\"><\u002Fspan>איך משחקים בהם נכון — כדי שהעבודה תהיה גם יעילה וגם מהנה<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 6: TAKEAWAYS -->\n  <section data-screen-label=\"Takeaways\" style=\"background: #FFFFFF; padding: 80px 32px;\">\n    <div style=\"max-width: 700px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 30px; color: #2E5C8A; text-align: center; margin: 0 0 40px;\">מה לוקחים הביתה<\u002Fh2>\n      <ul style=\"margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 20px;\">\n        <li style=\"display: flex; align-items: flex-start; gap: 14px; font-size: 18px; line-height: 1.6;\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0; margin-top:2px;\"><path d=\"M5 13l4 4L19 7\" stroke=\"#4A7FB5\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>מפת דרכים להיכרות עם הכעס ולהבחנתו ממצבים רגשיים דומים<\u002Fli>\n        <li style=\"display: flex; align-items: flex-start; gap: 14px; font-size: 18px; line-height: 1.6;\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0; margin-top:2px;\"><path d=\"M5 13l4 4L19 7\" stroke=\"#4A7FB5\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>מיפוי משחקים מוכרים לפי מטרות טיפוליות: אימפולסיביות, הרפיה, הטיות עוינות<\u002Fli>\n        <li style=\"display: flex; align-items: flex-start; gap: 14px; font-size: 18px; line-height: 1.6;\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0; margin-top:2px;\"><path d=\"M5 13l4 4L19 7\" stroke=\"#4A7FB5\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>דרכים לגיוס מוטיבציה — גם אצל המטופלים המתנגדים ביותר<\u002Fli>\n        <li style=\"display: flex; align-items: flex-start; gap: 14px; font-size: 18px; line-height: 1.6;\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0; margin-top:2px;\"><path d=\"M5 13l4 4L19 7\" stroke=\"#4A7FB5\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>כלים לשילוב ההורים בתהליך דרך המשחק<\u002Fli>\n        <li style=\"display: flex; align-items: flex-start; gap: 14px; font-size: 18px; line-height: 1.6;\"><svg width=\"24\" height=\"24\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" style=\"flex-shrink:0; margin-top:2px;\"><path d=\"M5 13l4 4L19 7\" stroke=\"#4A7FB5\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg>הקלטת הסדנה לצפייה חוזרת עד 60 יום מסיומה<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 7: MONDAY MORNING -->\n  <section data-screen-label=\"Monday morning\" style=\"background: #FDFCFA; padding: 88px 32px;\">\n    <div style=\"max-width: 740px; margin: 0 auto; text-align: center;\">\n      <p style=\"font-size: 22px; line-height: 1.7; color: #2E5C8A; margin: 0 0 24px;\">\n        ביום שני בבוקר ייכנס אליכם לחדר ילד שכועס. על ההורים, על בית הספר — ועכשיו קצת גם עליכם. רק שהפעם, במקום להיאבק בהתנגדות, אתם פותחים חפיסת טאקי. ותוך שני סיבובים, הכעס שהיה קיר — הופך לחומר העבודה של הפגישה.\n      <\u002Fp>\n      <p style=\"font-size: 22px; line-height: 1.7; color: #2F3A47; margin: 0;\">\n        בשביל הרגעים האלה בדיוק נבנתה הסדנה: לא עוד הרצאה על כעס — אלא כלים שיושבים איתכם ליד שולחן הטיפולים כבר בפגישה הבאה.\n      <\u002Fp>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 8: DETAILS & SIGNUP -->\n  <section id=\"signup\" data-screen-label=\"Details &amp; signup\" style=\"background: #EDF3FA; padding: 88px 32px;\">\n    <div style=\"max-width: 640px; margin: 0 auto;\">\n      <div style=\"background: #FFFFFF; border-radius: 20px; padding: 44px; box-shadow: 0 20px 50px -24px rgba(46,92,138,0.3);\">\n        <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 26px; color: #2E5C8A; text-align: center; margin: 0 0 32px;\">פרטים והרשמה<\u002Fh2>\n        <div style=\"display: flex; flex-direction: column; gap: 0;\">\n          <div style=\"display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #EDF3FA;\"><span style=\"color: #4A7FB5; font-weight: 600;\">מועד<\u002Fspan><span>יום שלישי, 11.8.2026<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #EDF3FA;\"><span style=\"color: #4A7FB5; font-weight: 600;\">שעות<\u002Fspan><span>12:00–13:30 ו-14:00–15:30<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #EDF3FA;\"><span style=\"color: #4A7FB5; font-weight: 600;\">מיקום<\u002Fspan><span>זום — קישור נשלח לנרשמים בבוקר יום הסדנה<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #EDF3FA;\"><span style=\"color: #4A7FB5; font-weight: 600;\">הקלטה<\u002Fspan><span>זמינה לצפייה עד 60 יום לאחר הסדנה<\u002Fspan><\u002Fdiv>\n          <div style=\"display: flex; justify-content: space-between; padding: 14px 0;\"><span style=\"color: #4A7FB5; font-weight: 600;\">השקעה<\u002Fspan><span>₪249 · מכירה מוקדמת: <strong style=\"color:#2E5C8A;\">₪199<\u002Fstrong> (בתוקף עד 31.7.2026)<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align: center; margin-top: 32px;\">\n          <a href=\"#\" style=\"display: inline-block; background: #3E8E9E; color: #FFFFFF; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 999px; text-decoration: none;\" style-hover=\"background: #357c8a;\">אני רוצה לשריין מקום<\u002Fa>\n          <div style=\"font-size: 14px; color: #4A7FB5; margin-top: 14px;\">לא יכולים להגיע בזמן אמת? ההקלטה מחכה לכם 60 יום.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border: 1px solid #B8CFE5; border-radius: 16px; padding: 24px 28px; margin-top: 24px; font-size: 16px; line-height: 1.6;\">\n        💡 הסדנה חלק ממחזור PlayLiss קיץ 2026 — <a href=\"./Workshop%20Main%20Page.dc.html#tracks\" style=\"color: #4A7FB5; font-weight: 600;\">כל שש הסדנאות ב-₪849<\u002Fa>, מחיר קבוע וללא מכירה מוקדמת. רוכשים 3 סדנאות ומעלה? הנחה של ₪100 מתווספת אוטומטית בקופה.\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 9: ABOUT ROEE -->\n  <section data-screen-label=\"About Roee\" style=\"background: #FFFFFF; padding: 88px 32px;\">\n    <div style=\"max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 48px; align-items: center;\">\n      <div>\n        <image-slot id=\"roee-photo\" shape=\"rounded\" radius=\"18\" style=\"width: 100%; height: 380px;\" placeholder=\"תמונת רועי ליס\"><\u002Fimage-slot>\n        <img src=\"495f1834-2cdd-4da4-8041-1fe2b5a7c219\" alt=\"כריכת הר הכעס\" style=\"width: 110px; height: 156px; margin-top: 20px; border-radius: 10px; object-fit: cover;\">\n      <\u002Fdiv>\n      <div>\n        <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; color: #2E5C8A; margin: 0 0 20px;\">נעים להכיר, רועי ליס<\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 18px;\">פסיכולוג חינוכי מומחה, מומחה ומדריך בהסמכה בטיפול קוגניטיבי-התנהגותי (CBT) בילדים ונוער, מטפל בביופידבק ובסכמה תרפיה. מרצה בעבר באוניברסיטה העברית בירושלים, באוניברסיטת תל אביב ובמכללה האקדמית קריית אונו.<\u002Fp>\n        <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 18px;\">את השנים האחרונות הקדשתי לטיפול במאות ילדים, בני נוער והוריהם, תוך שימוש נרחב במשחקים מוכרים ככלים טיפוליים. מתוך העבודה הזאת נולדה גם סדרת הספרים \"אדם ודייגו בארץ הרגשות\" — ובהם הספר \"הר הכעס\", שממנו קיבלה הסדנה את שמה.<\u002Fp>\n        <a href=\"#\" style=\"color: #4A7FB5; font-weight: 600; font-size: 17px; text-decoration: none;\">למאמר שפרסמתי בפסיכולוגיה עברית: \"לשחק CBT — מדריך למשחקים\" ←<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 10: TESTIMONIALS -->\n  <section data-screen-label=\"Testimonials\" style=\"background: #FDFCFA; padding: 88px 32px;\">\n    <div style=\"max-width: 1000px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; color: #2E5C8A; text-align: center; margin: 0 0 40px;\">מטפלים מספרים על הסדנה<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 28px;\">\n        <div style=\"background: #FFFFFF; border-radius: 16px; padding: 32px;\">\n          <p style=\"font-size: 17px; line-height: 1.7; margin: 0 0 20px; color: #2F3A47;\">\"למען האמת חשבתי שיהיה מדובר ב'עוד תוכן' שלוקחים עליו כסף. לשמחתי, מהר מאוד הבנתי שמדובר בקורס מקצועי מאוד... לא מדובר על תיאוריה, אלא על חשיפת הניסיון המקצועי והמשמעותי בשדה הטיפולי. מזה כ-15 שנים אני עוסק בהתערבויות עם ילדים ומתבגרים עם הפרעת קשב וקשיי התנהגות — הקורס הזה עשה לי סדר!\"<\u002Fp>\n          <div style=\"font-weight: 700; color: #2E5C8A;\">יותם ויסקופ (.Ed.M)<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #4A7FB5;\">מתמחה בתחום הפרעות התנהגות ולקויות למידה<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FFFFFF; border-radius: 16px; padding: 32px;\">\n          <p style=\"font-size: 17px; line-height: 1.7; margin: 0 0 20px; color: #2F3A47;\">\"הסדנה מרחיבה את ארגז הכלים ותורמת למפגש חווייתי. רועי מלמד עקרונות לשימוש במשחקים מוכרים וזמינים — חתחתול, טאקי, ארבע בשורה ועוד — ככלים טיפוליים למגוון קשיים של ילדים.\"<\u002Fp>\n          <div style=\"font-weight: 700; color: #2E5C8A;\">דינה רדי<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #4A7FB5;\">מטפלת CBT<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 11: FAQ -->\n  <section data-screen-label=\"FAQ\" style=\"background: #FFFFFF; padding: 88px 32px;\">\n    <div style=\"max-width: 720px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; color: #2E5C8A; text-align: center; margin: 0 0 40px;\">שאלות נפוצות<\u002Fh2>\n      <sc-for list=\"{{ faqs }}\" as=\"faq\" hint-placeholder-count=\"4\">\n        <div style=\"border-bottom: 1px solid #EDF3FA;\">\n          <div sc-camel-on-click=\"{{ faq.toggle }}\" style=\"display: flex; align-items: center; justify-content: space-between; padding: 22px 4px; cursor: pointer; gap: 16px;\">\n            <span style=\"font-size: 18px; font-weight: 600; color: #2E5C8A;\">{{ faq.q }}<\u002Fspan>\n            <span style=\"flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%; background: #EDF3FA; display: flex; align-items: center; justify-content: center; transform: {{ faq.rotate }}; transition: transform 0.2s;\">\n              <svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\"><path d=\"M12 5v14M5 12h14\" stroke=\"#4A7FB5\" stroke-width=\"2.2\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n            <\u002Fspan>\n          <\u002Fdiv>\n          <sc-if value=\"{{ faq.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding: 0 4px 22px; font-size: 17px; line-height: 1.7; color: #2F3A47; animation: faqOpen 0.2s ease;\">{{ faq.a }}<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 12: CLOSING CTA — DARK -->\n  <section data-screen-label=\"Closing CTA\" style=\"background: #2E5C8A; padding: 88px 32px; text-align: center;\">\n    <div style=\"max-width: 700px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 30px; line-height: 1.5; color: #FFFFFF; margin: 0 0 32px;\">את הספר על הר הכעס כבר כתבתי. בסדנה נלמד יחד איך עוצרים אותו בקליניקה.<\u002Fh2>\n      <a href=\"#signup\" style=\"display: inline-block; background: #3E8E9E; color: #FFFFFF; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 999px; text-decoration: none;\" style-hover=\"background: #357c8a;\">לשריין מקום בסדנת הקיץ<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION: TEAM WORKSHOP -->\n  <section data-screen-label=\"Team workshop\" style=\"background: #FFFFFF; padding: 56px 32px; text-align: center;\">\n    <div style=\"max-width: 620px; margin: 0 auto;\">\n      <h3 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 21px; color: #2E5C8A; margin: 0 0 10px;\">רוצים את הסדנה הזאת אצל הצוות שלכם?<\u002Fh3>\n      <p style=\"font-size: 16px; line-height: 1.6; color: #2F3A47; margin: 0 0 20px;\">אני מעביר את סדנאות PlayLiss גם לצוותים — שפ\"חים, מרפאות, מרכזי טיפול ומסגרות חינוך — בהתאמה לצרכי הצוות, פנים אל פנים או בזום. ⭐ 4.91/5 על ההנחיה, כנס הפסיכולוגיה החינוכית 2024.<\u002Fp>\n      <a href=\"#\" style=\"display: inline-block; background: transparent; border: 2px solid #3E8E9E; color: #3E8E9E; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 16px; padding: 12px 32px; border-radius: 999px; text-decoration: none;\" style-hover=\"background: #3E8E9E; color: #FFFFFF;\">להזמנת סדנה לצוות ←<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 13: MORE IN SERIES -->\n  <section data-screen-label=\"More in series\" style=\"background: #FDFCFA; padding: 72px 32px;\">\n    <div style=\"max-width: 1080px; margin: 0 auto;\">\n      <div style=\"display: flex; align-items: center; gap: 14px; margin-bottom: 28px; flex-wrap: wrap;\">\n        <img src=\"aa277124-0bfb-498d-a765-4fe11ffc270d\" alt=\"PlayLiss\" style=\"height: 40px; width: auto;\">\n        <span style=\"font-size: 16px; color: #2F3A47;\">עוד בסדרת PlayLiss — משתתפים רבים ממשיכי margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 32px;\">\n      <div>\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 20px; color: #FFFFFF; margin-bottom: 12px;\">רועי ליס<\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.7; color: #B8CFE5; margin: 0; max-width: 280px;\">פסיכולוג חינוכי מומחה, <br>מומחה בטיפול CBT לילדים ונוער<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px;\">\n        <span>שפרינצק 3, תל אביב<\u002Fspan>\n        <a href=\"tel:0549107047\" style=\"color: #EDF3FA;\">054-910-7047<\u002Fa>\n        <a href=\"mailto:roee@roeeliss.co.il\" style=\"color: #EDF3FA;\">roee@roeeliss.co.il<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px;\">\n        <a href=\"./Workshop%20Main%20Page.dc.html\" style=\"color: #EDF3FA;\">כל הסדנאות<\u002Fa>\n        <a href=\"https://roeeliss.co.il/%d7%aa%d7%a7%d7%a0%d7%95%d7%9f/\" target=\"_blank\" rel=\"noopener\" style=\"color: #EDF3FA;\">תקנון<\u002Fa>\n        <a href=\"https://roeeliss.co.il/privacy/\" target=\"_blank\" rel=\"noopener\" style=\"color: #EDF3FA;\">מדיניות פרטיות<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"max-width: 1120px; margin: 36px auto 0; padding-top: 28px; border-top: 1px solid #2E5C8A; display: flex; flex-direction: column; align-items: center; gap: 14px;\">\n      <div style=\"display: flex; gap: 12px;\">\n        <a href=\"https://www.facebook.com/AdamVeDiego\" target=\"_blank\" rel=\"noopener\" aria-label=\"פייסבוק\" style=\"width: 34px; height: 34px; border-radius: 50%; background: #2E5C8A; display: flex; align-items: center; justify-content: center; color: #EDF3FA;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M22 12.06C22 6.5 17.52 2 12 2S2 6.5 2 12.06C2 17.08 5.66 21.23 10.44 22v-7.03H7.9v-2.91h2.54V9.85c0-2.5 1.49-3.89 3.77-3.89 1.09 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56v1.88h2.78l-.44 2.91h-2.34V22C18.34 21.23 22 17.08 22 12.06z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"https://www.instagram.com/adamanddiego/\" target=\"_blank\" rel=\"noopener\" aria-label=\"אינסטגרם\" style=\"width: 34px; height: 34px; border-radius: 50%; background: #2E5C8A; display: flex; align-items: center; justify-content: center; color: #EDF3FA;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"5\"><\u002Frect><circle cx=\"12\" cy=\"12\" r=\"4.2\"><\u002Fcircle><circle cx=\"17.2\" cy=\"6.8\" r=\"1.1\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"https://www.youtube.com/@AdamandDiego\" target=\"_blank\" rel=\"noopener\" aria-label=\"יוטיוב\" style=\"width: 34px; height: 34px; border-radius: 50%; background: #2E5C8A; display: flex; align-items: center; justify-content: center; color: #EDF3FA;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M22.5 7.2s-.22-1.55-.9-2.23c-.86-.9-1.82-.9-2.26-.96C16.2 3.75 12 3.75 12 3.75h-.01s-4.2 0-7.34.26c-.44.06-1.4.06-2.26.96-.68.68-.9 2.23-.9 2.23S1.25 9 1.25 10.8v1.4c0 1.8.24 3.6.24 3.6s.22 1.55.9 2.23c.86.9 1.99.87 2.5.97 1.8.17 7.11.26 7.11.26s4.2-.01 7.34-.27c.44-.06 1.4-.06 2.26-.96.68-.68.9-2.23.9-2.23s.24-1.8.24-3.6v-1.4c0-1.8-.24-3.6-.24-3.6zM9.9 14.9V8.9l6.1 3-6.1 3z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n        <a href=\"https://www.tiktok.com/@adamanddiego\" target=\"_blank\" rel=\"noopener\" aria-label=\"טיקטוק\" style=\"width: 34px; height: 34px; border-radius: 50%; background: #2E5C8A; display: flex; align-items: center; justify-content: center; color: #EDF3FA;\">\n          <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M16.5 2h-3v13.6a3 3 0 1 1-2.4-2.94v-3.1a6.1 6.1 0 1 0 5.4 6.06V8.9a7.6 7.6 0 0 0 4.5 1.46V7.4a4.6 4.6 0 0 1-4.5-4.4z\"><\u002Fpath><\u002Fsvg>\n        <\u002Fa>\n      <\u002Fdiv>\n      <div style=\"font-size: 13px; color: #8FAAC7;\">© {{ year }} רועי ליס · PlayLiss · תל אביב<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- STICKY MOBILE CTA -->\n  <sc-if value=\"{{ isMobile }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; background: #FFFFFF; padding: 12px 16px; box-shadow: 0 -8px 24px -8px rgba(46,92,138,0.25);\">\n      <a href=\"#signup\" style=\"display: block; text-align: center; background: #3E8E9E; color: #FFFFFF; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 17px; padding: 14px; border-radius: 999px; text-decoration: none;\">לשריין מקום · ₪199<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\n\nclass Component extends DCLogic {\n  state = {\n    isMobile: typeof window !== 'undefined' ? window.innerWidth < 860 : false,\n    faqOpen: { 0: false, 1: false, 2: false, 3: false }\n  };\n\n  componentDidMount() {\n    this._onResize = () => this.setState({ isMobile: window.innerWidth < 860 });\n    window.addEventListener('resize', this._onResize);\n  }\n\n  componentWillUnmount() {\n    window.removeEventListener('resize', this._onResize);\n  }\n\n  toggleFaq(i) {\n    this.setState(s => ({ faqOpen: { ...s.faqOpen, [i]: !s.faqOpen[i] } }));\n  }\n\n  renderVals() {\n    const raw = [\n      { q: 'לא אוכל להשתתף בזמן אמת — מה עושים?', a: 'נרשמים כרגיל. הקלטת הסדנה זמינה לצפייה עד 60 יום מסיומה, כך שאפשר להשלים הכל בקצב שלכם.' },\n      { q: 'אפשר לרכוש רק את ההקלטה, בלי להשתתף במפגשים החיים?', a: 'כן — גם אם המועד עבר, אפשר לרכוש גישה להקלטת הסדנה ולצפות בה בקצב שלכם.' },\n      { q: 'אני לא מטפל/ת CBT \"מובהק/ה\" — הסדנה רלוונטית לי?', a: 'בהחלט. הכלים מתאימים לכל איש מקצוע שעובד עם ילדים ומשלב — או רוצה להתחיל לשלב — משחק בעבודתו, בכל גישה טיפולית.' },\n      { q: 'האם ניתן אישור השתתפות?', a: 'כן, כל משתתף ומשתתפת מקבלים אישור השתתפות דיגיטלי בסיום הסדנה.' }\n    ];\n    const faqs = raw.map((f, i) => ({\n      q: f.q,\n      a: f.a,\n      open: !!this.state.faqOpen[i],\n      rotate: this.state.faqOpen[i] ? 'rotate(45deg)' : 'rotate(0deg)',\n      toggle: () => this.toggleFaq(i)\n    }));\n\n    return {\n      isMobile: this.state.isMobile,\n      faqs,\n      year: new Date().getFullYear()\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
