document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ם<\u002Fa>\n        <a href=\"#tracks\" style=\"background: #3E8E9E; color: #FFFFFF; padding: 10px 22px; border-radius: 999px; font-weight: 600; text-decoration: none; white-space: nowrap; flex-shrink: 0;\">להרשמה<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 1: HERO -->\n  <section data-screen-label=\"Hero\" style=\"background: #FFFFFF; padding: 80px 32px 64px; max-width: 900px; margin: 0 auto; text-align: center;\">\n    <div style=\"display: inline-block; background: #EDF3FA; color: #2E5C8A; font-size: 14px; font-weight: 600; padding: 6px 16px; border-radius: 999px; margin-bottom: 22px;\">סדנאות מקוונות למטפלים · המחזור השישי<\u002Fdiv>\n    <h1 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 52px; line-height: 1.2; color: #2E5C8A; margin: 0 0 22px;\">Play<span style=\"color:#4A7FB5;\">Liss<\u002Fspan> — מחזור קיץ 2026<\u002Fh1>\n    <p style=\"font-size: 22px; line-height: 1.65; color: #2E5C8A; font-weight: 700; margin: 0 auto 32px; max-width: 680px;\">המשחקים שכבר נמצאים אצלכם בקליניקה — טאקי, ארבע בשורה, חתחתול — יכולים להיות כלי הטיפול המדויקים ביותר שלכם.&nbsp;<br>שיטה אחת. שישה תחומים. קיץ אחד.<\u002Fp>\n    <div style=\"display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin-bottom: 24px;\">\n      <a href=\"#tracks\" style=\"display: inline-block; background: #3E8E9E; color: #FFFFFF; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 999px; text-decoration: none;\" style-hover=\"background: #357c8a;\">להרשמה למחזור קיץ 2026<\u002Fa>\n      <a href=\"#schedule\" style=\"display: inline-block; background: transparent; border: 2px solid #B8CFE5; color: #2E5C8A; font-family: 'Assistant', sans-serif; font-weight: 600; font-size: 18px; padding: 14px 38px; border-radius: 999px; text-decoration: none;\" style-hover=\"background: #EDF3FA;\">ללוח הסדנאות ↓<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"font-size: 17px; color: #2E5C8A; font-weight: 700; margin-bottom: 10px;\">מנחה: רועי ליס · פסיכולוג חינוכי מומחה · מומחה ומדריך בהסמכה בטיפול קוגניטיבי-התנהגותי (CBT) בילדים ונוער<\u002Fdiv>\n    <div style=\"font-size: 15px; color: #4A7FB5; margin-bottom: 18px;\">⭐ 4.91/5 משוב המשתתפים הרשמי בכנס הפסיכולוגיה החינוכית 2024<\u002Fdiv>\n    <div style=\"display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;\">\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">פסיכולוגים<\u002Fspan>\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">עובדים סוציאליים<\u002Fspan>\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">מטפלי CBT<\u002Fspan>\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">מטפלים רגשיים<\u002Fspan>\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">מאמנים<\u002Fspan>\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">מטפלים באומנות<\u002Fspan>\n      <span style=\"background: #EDF3FA; color: #4A7FB5; font-size: 13px; padding: 5px 14px; border-radius: 999px;\">אנשי חינוך<\u002Fspan>\n    <\u002Fdiv>\n\n    <div style=\"display: flex; justify-content: center; gap: 18px; margin-top: 48px;\">\n      \n      \n      \n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 2: PAIN POINTS -->\n  <section data-screen-label=\"Pain points\" style=\"background: #FDFCFA; padding: 84px 32px;\">\n    <div style=\"max-width: 980px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 30px; color: #2E5C8A; text-align: center; margin: 0 0 48px;\">כולנו מכירים את הרגעים האלה בקליניקה...<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px;\">\n\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 32px;\">\n          <span style=\"display: inline-block; background: #B8CFE5; color: #2E5C8A; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 14px;\">סדנת היסודות<\u002Fspan>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #2F3A47;\">\"למדתי CBT בילדים — פרוטוקולים, עבודה עם הורים, התאמות התפתחותיות. ויש לי מדף מלא משחקי קופסה בקליניקה: אני משתמשת בהם לחימום, סיום המפגשים ברוח טובה ויצירת קשר. אני יודעת שאפשר הרבה יותר — שהמשחק עצמו יכול להיות ההתערבות. אני פשוט לא יודעת איך.\"<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: #4A7FB5;\">את החיבור הזה בדיוק סדנת היסודות עושה — שיטה סדורה שהופכת את המשחקים שכבר בקליניקה לעבודת CBT מדויקת.<\u002Fp>\n          <a href=\"#\" style=\"color: #2E5C8A; font-weight: 600; font-size: 15px; text-decoration: none;\">לשחק CBT עם ילדים ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 32px;\">\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #2F3A47;\">\"בטיפול בכעסים אני מרגישה שאני מאלתרת: קצת פסיכואדוקציה, קצת תרגילי הרגעה. חסר לי פרוטוקול מסודר — דרך להעביר אותו לילדים שפעמים רבות בכלל לא רוצים להיות אצלי בחדר.\"<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: #4A7FB5;\">'עוצרים את הר הכעס' נותנת את שניהם: פרוטוקול סדור לטיפול בכעסים וקשיי ויסות — שעובר כולו דרך משחקים שמגייסים את הילד מהמפגש הראשון, בלי שזה מרגיש לו כמו טיפול.<\u002Fp>\n          <a href=\"./Workshop%20-%20Har%20HaKaas.dc.html\" style=\"color: #2E5C8A; font-weight: 600; font-size: 15px; text-decoration: none;\">עוצרים את הר הכעס ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 32px;\">\n          <span style=\"display: inline-block; background: #B8CFE5; color: #2E5C8A; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 14px;\">המבוקשת ביותר<\u002Fspan>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #2F3A47;\">\"הופנתה אליי ילדה 'בלי חברות'. אני יכולה לדבר איתה על הפסקות, לתרגל משפטי פתיחה — אבל שיחה על מיומנויות חברתיות היא לא מיומנות חברתית. והמשחקים שהיא הכי אוהבת, אלה שיושבים לי על המדף? אני לא יודעת איך להפוך אותם לאימון חברתי אמיתי.\"<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: #4A7FB5;\">'משחקים וחברים' מלמדת בדיוק את זה: איך המשחקים המוכרים שילדים אוהבים — טאקי, ארבע בשורה, חתחתול — הופכים לכלי מכוון להקניה ולתרגול של מיומנויות חברתיות: המתנה לתור, התמודדות עם הפסד, שיתוף פעולה ומשא ומתן. עם פרוטוקול עבודה סדור — לקליניקה הפרטנית ולקבוצה החברתית.<\u002Fp>\n          <a href=\"#\" style=\"color: #2E5C8A; font-weight: 600; font-size: 15px; text-decoration: none;\">משחקים וחברים ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 32px;\">\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #2F3A47;\">\"המפגשים עם ילדים עם קשיי קשב מרגישים לי כמו הקושי שלהם עצמו: קופצים מדבר לדבר, מתחילים ולא מסיימים, מאבדים את החוט. לפעמים נדמה שחוסר השקט שלהם נדבק גם אליי — ואני יוצאת מהמפגש מפוזרת כמוהם, מחפשת את המבנה שיחזיק את שנינו.\"<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: #4A7FB5;\">'ארגז הכלים של קשב וריכוז' עושה למפגש בדיוק את מה שהוא עושה לילד — נותנת לו מבנה: אימון תפקודים ניהוליים דרך משחקים מוכרים שהילד אוהב.<\u002Fp>\n          <a href=\"#\" style=\"color: #2E5C8A; font-weight: 600; font-size: 15px; text-decoration: none;\">ארגז הכלים והמשחקים של הפרעת קשב וריכוז ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 32px;\">\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #2F3A47;\">\"התקשרה אליי אמא: לילד יש טיקים, הרופאה המליצה על טיפול התנהגותי. ואני מולה מתלבטת — להגיד 'זה לא התחום שלי' ולהפנות הלאה? אני מטפלת CBT מנוסה. טיפול בטיקים פשוט אף פעם לא למדתי.\"<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: #4A7FB5;\">'טאקי טיקים' סוגרת בדיוק את הפער הזה: פרוטוקול CBIT — הטיפול ההתנהגותי המבוסס ביותר לטיקים — מתורגם לשפה של ילדים, דרך משחקים שהופכים את האימון לחוויה.<\u002Fp>\n          <a href=\"#\" style=\"color: #2E5C8A; font-weight: 600; font-size: 15px; text-decoration: none;\">טאקי טיקים ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 18px; padding: 32px;\">\n          <span style=\"display: inline-block; background: #B8CFE5; color: #2E5C8A; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px; margin-bottom: 14px;\">למתקדמים<\u002Fspan>\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 16px; color: #2F3A47;\">\"יש ילדים שמתקשים להביא את עצמם לחדר. הפחד, הבושה, הכאב — הכל נשאר מאחורי 'בסדר', 'לא יודע', או לפעמים מאחורי התנהגות תוקפנית. אני יודעת שמאחורי ההגנות יש ילד פגיע שצריך אותי — האתגר שלי הוא להגיע אליו.\"<\u002Fp>\n          <p style=\"font-size: 15px; line-height: 1.7; margin: 0 0 18px; color: #4A7FB5;\">'Schema Play Therapy' — הסדנה המתקדמת של המחזור — מלמדת בדיוק את הדרך לשם: עבודה עם סכמות ומודים דרך משחק. כשהפגיעות לא צריכה להיאמר ישירות אלא יכולה לשחק על הלוח, הילד הנמנע מוצא דרך בטוחה להביא אותה.<\u002Fp>\n          <a href=\"#\" style=\"color: #2E5C8A; font-weight: 600; font-size: 15px; text-decoration: none;\">Schema Play Therapy ←<\u002Fa>\n        <\u002Fdiv>\n\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 3: AUTHORITY (ABOUT ROEE + TESTIMONIALS) -->\n  <section data-screen-label=\"Authority\" style=\"background: #FFFFFF; padding: 88px 32px;\">\n    <div style=\"max-width: 1000px; margin: 0 auto;\">\n      <div style=\"display: grid; grid-template-columns: 0.8fr 1.2fr; gap: 48px; align-items: center; margin-bottom: 72px;\">\n        <div style=\"position: relative; padding-bottom: 36px;\">\n          <img src=\"e1421bd3-93b9-4926-a92e-ccc81c65e314\" alt=\"רועי ליס\" style=\"width: 100%; height: 380px; border-radius: 18px; object-fit: cover; display: block;\">\n          <img src=\"51bf3df6-f59b-4684-969e-5b914c7c60bc\" alt=\"כריכת הר הכעס\" style=\"position: absolute; bottom: 0; left: -28px; width: 108px; height: 154px; border-radius: 10px; object-fit: cover; transform: rotate(-8deg); box-shadow: 0 14px 28px -10px rgba(46,92,138,0.45); border: 4px solid #FFFFFF;\">\n          <img src=\"b17dc95d-5aa4-4f11-9c08-485966a56652\" alt=\"יער המחשבות המפחידות\" style=\"position: absolute; bottom: -12px; left: 52px; width: 108px; height: 154px; border-radius: 10px; object-fit: cover; transform: rotate(7deg); box-shadow: 0 14px 28px -10px rgba(46,92,138,0.45); border: 4px solid #FFFFFF;\">\n        <\u002Fdiv>\n        <div>\n          <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; color: #2E5C8A; margin: 0 0 20px;\">נעים להכיר, רועי ליס<\u002Fh2>\n          <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 18px;\">פסיכולוג חינוכי מומחה, מומחה ומדריך בהסמכה בטיפול קוגניטיבי-התנהגותי (CBT) בילדים ונוער, מטפל בביופידבק. בקליניקה שלי בתל אביב אני מטפל בילדים, מתבגרים והוריהם — ואת PlayLiss, השיטה שגיבשתי לאורך שנים בקליניקה, אני מביא לסדנאות.<\u002Fp>\n          <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 18px;\">אני גם מחבר סדרת הספרים \"אדם ודייגו בארץ הרגשות\", ובהם \"יער המחשבות המפחידות\" ו\"הר הכעס\".<\u002Fp>\n          <a href=\"https://www.hebpsy.net/articles.asp?id=4371\" target=\"_blank\" rel=\"noopener\" style=\"color: #4A7FB5; font-weight: 600; font-size: 17px; text-decoration: none;\">למאמר שפרסמתי בפסיכולוגיה עברית: \"לשחק CBT — מדריך למשחקים\" ←<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; color: #2E5C8A; text-align: center; margin: 0 0 48px;\">מטפלים מספרים<\u002Fh2>\n      <div style=\"display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px;\">\n        <div style=\"background: #FDFCFA; border-radius: 16px; padding: 32px;\">\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 20px; color: #2F3A47;\">\"עברתי לפני כשנתיים את הסדנה 'טאקי טיקים' — ומאז טיפלתי במספר ילדים עם טיקים בהצלחה רבה.\"<\u002Fp>\n          <div style=\"font-weight: 700; color: #2E5C8A;\">הדס לביא נאור<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #4A7FB5;\">מטפלת CBT, מומחית תחום נפשי<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FDFCFA; border-radius: 16px; padding: 32px;\">\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 20px; color: #2F3A47;\">\"מזה כ-15 שנים אני עוסק בהתערבויות עם ילדים ומתבגרים — הקורס הזה עשה לי סדר!\"<\u002Fp>\n          <div style=\"font-weight: 700; color: #2E5C8A;\">יותם ויסקופ (.Ed.M)<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #4A7FB5;\">מתמחה בהפרעות התנהגות ולקויות למידה<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background: #FDFCFA; border-radius: 16px; padding: 32px;\">\n          <p style=\"font-size: 16px; line-height: 1.7; margin: 0 0 20px; color: #2F3A47;\">\"האזנתי לשתי הסדנאות האחרונות. נהניתי מהארגון, הבהירות, התשובות להתנגדויות. השכלתי וקיבלתי המון — ואני לא חדשה במקצוע.\"<\u002Fp>\n          <div style=\"font-weight: 700; color: #2E5C8A;\">אורנה רוטשילד-מינקובסקי<\u002Fdiv>\n          <div style=\"font-size: 14px; color: #4A7FB5;\">מטפלת קוגניטיבית-התנהגותית (CBT)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 4: LEARNING PATH -->\n  <section data-screen-label=\"Learning path\" style=\"background: #FDFCFA; padding: 84px 32px;\">\n    <div style=\"max-width: 940px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 28px; color: #2E5C8A; text-align: center; margin: 0 0 48px;\">מסלול הלמידה<\u002Fh2>\n\n      <div style=\"display: flex; flex-direction: column; align-items: center; gap: 0;\">\n        <div style=\"background: #2E5C8A; color: #FFFFFF; border-radius: 16px; padding: 22px 40px; text-align: center; box-shadow: 0 16px 36px -18px rgba(46,92,138,0.5);\">\n          <div style=\"font-size: 13px; font-weight: 600; color: #B8CFE5; margin-bottom: 4px;\">קומה 1 · היסודות (כולם מתחילים כאן)<\u002Fdiv>\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 20px;\">לשחק CBT עם ילדים<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width: 2px; height: 36px; background: #B8CFE5;\"><\u002Fdiv>\n\n        <div style=\"width: 100%;\">\n          <div style=\"text-align: center; font-size: 13px; font-weight: 600; color: #4A7FB5; margin-bottom: 16px;\">קומה 2 · היישום (בוחרים לפי הקליניקה שלכם)<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;\">\n            <div style=\"background: #EDF3FA; border-radius: 12px; padding: 18px; text-align: center; font-size: 15px; font-weight: 600; color: #2E5C8A;\">עוצרים את הר הכעס<\u002Fdiv>\n            <div style=\"background: #EDF3FA; border-radius: 12px; padding: 18px; text-align: center; font-size: 15px; font-weight: 600; color: #2E5C8A;\">משחקים וחברים<\u002Fdiv>\n            <div style=\"background: #EDF3FA; border-radius: 12px; padding: 18px; text-align: center; font-size: 15px; font-weight: 600; color: #2E5C8A;\">ארגז הכלים של קשב וריכוז<\u002Fdiv>\n            <div style=\"background: #EDF3FA; border-radius: 12px; padding: 18px; text-align: center; font-size: 15px; font-weight: 600; color: #2E5C8A;\">טאקי טיקים<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"width: 2px; height: 36px; background: #B8CFE5;\"><\u002Fdiv>\n\n        <div style=\"border: 2px solid #B8CFE5; border-radius: 16px; padding: 20px 40px; text-align: center; position: relative;\">\n          <div style=\"position: absolute; top: -12px; right: 50%; transform: translateX(50%); background: #B8CFE5; color: #2E5C8A; font-size: 12px; font-weight: 700; padding: 4px 14px; border-radius: 999px;\">למתקדמים<\u002Fdiv>\n          <div style=\"font-size: 13px; font-weight: 600; color: #4A7FB5; margin-bottom: 4px; margin-top: 6px;\">קומה 3 · העומק<\u002Fdiv>\n          <div style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 20px; color: #2E5C8A;\">Schema Play Therapy<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- SECTION 5: SUMMER SCHEDULE — DARK -->\n  <section id=\"schedule\" data-screen-label=\"Summer schedule\" style=\"background: #2E5C8A; padding: 88px 32px;\">\n    <div style=\"max-width: 900px; margin: 0 auto;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 30px; color: #FFFFFF; text-align: center; margin: 0 0 48px;\">לוח סדנאות קיץ 2026&nbsp;<\u002Fh2>\n\n      <div style=\"display: flex; flex-direction: column; gap: 18px;\">\n        <div style=\"background: #FFFFFF; border-radius: 16px; padding: 26px 30px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n          <div style=\"min-width: 190px; font-size: 14px; color: #4A7FB5; font-weight: 600;\">ראשון, 9.8.2026<\u002Fdiv>\n          <div style=\"flex: 1; min-width: 220px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;\">\n              <span style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 19px; color: #2E5C8A;\">לשחק CBT עם ילדים<\u002Fspan>\n              <span style=\"background: #B8CFE5; color: #2E5C8A; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px;\">סדנת היסודות<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size: 15px; color: #2F3A47;\">איך תוכלו להפוך כל משחק אצלכם בקליניקה, לכלי טיפול קוגניטיבי-התנהגותי מהנה ויעיל?<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"#\" style=\"color: #4A7FB5; font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;\">לעמוד הסדנה ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 16px; padding: 26px 30px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n          <div style=\"min-width: 190px; font-size: 14px; color: #4A7FB5; font-weight: 600;\">שלישי, 11.8.2026<\u002Fdiv>\n          <div style=\"flex: 1; min-width: 220px;\">\n            <div style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 19px; color: #2E5C8A; margin-bottom: 4px;\">עוצרים את הר הכעס<\u002Fdiv>\n            <div style=\"font-size: 15px; color: #2F3A47;\">שליטה בכעסים וקשיי ויסות רגשי באמצעות משחקים מוכרים.<\u002Fdiv>\n          <\u002Fdiv>\n          <a href=\"./Workshop%20-%20Har%20HaKaas.dc.html\" style=\"color: #4A7FB5; font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap;\">לעמוד הסדנה ←<\u002Fa>\n        <\u002Fdiv>\n\n        <div style=\"background: #FFFFFF; border-radius: 16px; padding: 26px 30px; display: flex; align-items: center; gap: 24px; flex-wrap: wrap;\">\n          <div style=\"min-width: 190px; font-size: 14px; color: #4A7FB5; font-weight: 600;\">חמישי, 13.8.2026<\u002Fdiv>\n          <div style=\"flex: 1; min-width: 220px;\">\n            <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 4px; flex-wrap: wrap;\">\n              <span style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 19px; color: #2E5C8A;\">משחקים וחברים<\u002Fspan>\n              <span style=\"background: #B8CFE5; color: #2E5C8A; font-size: 12px; font-weight: 700; padding: 3px 12px; border-radius: 999px;\">המבוקשת ביותר<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"font-size: 15px; color: #2F3A47;\">פיתוח מיומנויות חברתיות, בעבודה פרטנית וקבוצתית,&nbsp; באמצעות המשחקים שילדים אוהבי
