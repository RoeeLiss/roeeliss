  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    const resourceBlobs = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

yle=\"color: #2F3A47;\">אדם ודייגו בארץ הרגשות<\u002Fa>\n        <a href=\"עמודי הסדנאות/PlayLiss Workshops - Main Page.html\" style=\"color: #2F3A47;\">סדנאות למטפלים<\u002Fa>\n        <a href=\"עיצוב עמוד המאמרים/Articles Page.html\" style=\"color: #2F3A47;\">מאמרים<\u002Fa>\n        <a href=\"עמוד מתנות של ידע/מתנות של ידע.html\" style=\"color: #2F3A47;\">מתנות של ידע<\u002Fa>\n        <a href=\"#contact\" style=\"background: #3E8E9E; color: #FFFFFF; padding: 10px 22px; border-radius: 999px; font-weight: 600;\">בואו נדבר<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 1: HOOK -->\n  <div data-screen-label=\"הוק\" style=\"max-width: 1120px; margin: 0 auto; padding: 72px 32px 88px; display: grid; grid-template-columns: 1.1fr 0.9fr; gap: 56px; align-items: center;\">\n    <div style=\"animation: fadeUp 0.7s ease both;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #EDF3FA; border: 1px solid #B8CFE5; color: #2E5C8A; padding: 8px 16px; border-radius: 999px; font-size: 15px; font-weight: 600; margin-bottom: 24px;\">\n        פסיכולוג חינוכי מומחה · מחבר סדרת אדם ודייגו\n      <\u002Fdiv>\n      <h1 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 44px; line-height: 1.25; color: #2E5C8A; margin: 0 0 24px;\">\n        היי, אני רועי.<br>אני מאמין שלכל ילד<br>מגיעה ילדות מאושרת.\n      <\u002Fh1>\n      <p style=\"font-size: 18px; line-height: 1.7; color: #2F3A47; max-width: 480px; margin: 0 0 36px;\">אבל ילדות, כמו שכולנו יודעים, היא לא תמיד קלה. יש ילדים שחיים בצל חרדות, אחרים מתמודדים עם התפרצויות וקשיי ויסות רגשי, עם קשיי קשב ולמידה, מתקשים למצוא את מקומם בין בני גילם, או נאבקים לתפקד אחרי אירוע קשה. בשבילם — ובשבילכם — אני כאן: בקליניקה, ובספרי \"אדם ודייגו בארץ הרגשות\".<\u002Fp>\n      <a href=\"#contact\" style=\"display: inline-block; background: #3E8E9E; color: #FFFFFF; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 999px;\">בואו נכיר<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"position: relative;\">\n      <div style=\"width: 100%; aspect-ratio: 4/5; border-radius: 28px; overflow: hidden; box-shadow: 0 24px 60px -20px rgba(46,92,138,0.35);\">\n        <image-slot id=\"roee-hero\" shape=\"rect\" src=\"fc16cedf-40b6-4a20-9ce6-59d84250a40d\" placeholder=\"תמונת רועי\"><\u002Fimage-slot>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 2: THE CLINIC -->\n  <div id=\"clinic\" data-screen-label=\"הקליניקה\" style=\"background: #FDFCFA; padding: 96px 32px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto;\">\n      <div style=\"max-width: 640px; margin: 0 auto 48px; text-align: center;\">\n        <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 34px; color: #2E5C8A; margin: 0 0 20px;\">\n          בואו לטפל בזה, ברצינות, ובמשחק\n        <\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.7; margin: 0;\">\n          הקליניקה שלי עברה לבית חדש בתל אביב. כאן אני מטפל בילדים ובבני נוער בגישת CBT: טיפול ממוקד ומותאם אישית, מלווה בהדרכת הורים לאורך כל הדרך, באמצעות שיחה, יצירה ומשחק.\n        <\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: grid; grid-template-columns: repeat(4, auto); justify-content: center; gap: 16px; margin-bottom: 44px;\">\n        <sc-for list=\"{{ topics }}\" as=\"topic\" hint-placeholder-count=\"8\">\n          <a href=\"{{ topic.href }}\" style=\"background: #EDF3FA; border: 1px solid #B8CFE5; color: #2E5C8A; padding: 12px 26px; border-radius: 999px; font-size: 16px; font-weight: 600; text-align: center; white-space: nowrap;\">\n            {{ topic.label }}\n          <\u002Fa>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"text-align: center;\">\n        <a href=\"#\" style=\"font-size: 17px; font-weight: 600; color: #4A7FB5;\">לעמודי הטיפול ←<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 3: BOOKS (dark blue) -->\n  <div id=\"books\" data-screen-label=\"הספרים\" style=\"background: #2E5C8A; padding: 100px 32px; color: #FFFFFF;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: grid; grid-template-columns: 0.9fr 1.1fr; gap: 64px; align-items: center;\">\n      <div style=\"display: flex; gap: 24px; justify-content: center;\">\n        <div>\n          <a href=\"#\" style=\"display: block; width: 190px; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 44px -12px rgba(0,0,0,0.4); transform: rotate(-4deg);\">\n            <image-slot id=\"book-cover-1\" shape=\"rect\" src=\"8bcc9347-bba3-4833-a139-5f630164073c\" placeholder=\"יער המחשבות המפחידות\"><\u002Fimage-slot>\n          <\u002Fa>\n          <p style=\"text-align: center; font-size: 14px; color: #B8CFE5; margin: 14px 0 0; line-height: 1.5;\">\n            <span style=\"display: block; font-weight: 700; color: #FFFFFF;\">יער המחשבות המפחידות<\u002Fspan>\n            לילדים שמתמודדים עם פחדים וחרדות\n          <\u002Fp>\n        <\u002Fdiv>\n        <div style=\"margin-top: 28px;\">\n          <a href=\"#\" style=\"display: block; width: 190px; aspect-ratio: 2/3; border-radius: 12px; overflow: hidden; box-shadow: 0 20px 44px -12px rgba(0,0,0,0.4); transform: rotate(4deg);\">\n            <image-slot id=\"book-cover-2\" shape=\"rect\" src=\"48c4935c-3278-46b6-bb15-d84b33d00674\" placeholder=\"הר הכעס\"><\u002Fimage-slot>\n          <\u002Fa>\n          <p style=\"text-align: center; font-size: 14px; color: #B8CFE5; margin: 14px 0 0; line-height: 1.5;\">\n            <span style=\"display: block; font-weight: 700; color: #FFFFFF;\">הר הכעס<\u002Fspan>\n            לילדים שמתפרצים ומתקשים להירגע\n          <\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"display: inline-flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.3); color: #FFFFFF; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; margin-bottom: 20px;\">\n          רבי־מכר · למעלה מ-8,000 עותקים בבתים ובקליניקות בישראל\n        <\u002Fdiv>\n        <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 32px; margin: 0 0 20px;\">\n          אדם ודייגו בארץ הרגשות\n        <\u002Fh2>\n        <p style=\"font-size: 18px; line-height: 1.7; color: #EDF3FA; max-width: 460px; margin: 0 0 12px;\">\n          סדרת ספרים טיפולית שנולדה בקליניקה: כלים אמיתיים מעולם ה-CBT, עטופים בהרפתקה שילדים מגיל 6 אוהבים לקרוא שוב ושוב.\n        <\u002Fp>\n        <p style=\"font-size: 18px; font-weight: 600; line-height: 1.7; color: #FFFFFF; max-width: 460px; margin: 0 0 28px;\">\n          הילדים מקבלים הרפתקה. אתם מקבלים שפה משותפת וכלים שעובדים — גם אחרי שהספר נסגר.\n        <\u002Fp>\n        <div style=\"border-right: 3px solid #B8CFE5; padding-right: 20px; margin-bottom: 32px;\">\n          <p style=\"font-size: 19px; font-style: italic; line-height: 1.6; margin: 0 0 8px; color: #FFFFFF;\">\n            \"גיליתי ספר ילדים חשוב מאין כמותו\"\n          <\u002Fp>\n          <p style=\"font-size: 16px; color: #B8CFE5; margin: 0 0 16px;\">— מיכל דליות<\u002Fp>\n          <p style=\"font-size: 15px; font-style: italic; line-height: 1.6; margin: 0 0 6px; color: #EDF3FA;\">\n            \"ספר מקסים שעוסק בצורה חכמה ורגישה בהבדל בין רגשות טבעיים של פחד לבין מצבים שמתעוררת בהם חרדה\"\n          <\u002Fp>\n          <p style=\"font-size: 14px; color: #B8CFE5; margin: 0;\">— פרופ' תומר שכנר, בית הספר למדעי הפסיכולוגיה, אוניברסיטת חיפה<\u002Fp>\n        <\u002Fdiv>\n        <a href=\"#\" style=\"display: inline-block; background: #FFFFFF; color: #2E5C8A; font-weight: 600; font-size: 18px; padding: 16px 40px; border-radius: 999px;\">להכיר את הספרים ←<\u002Fa>\n        <p style=\"font-size: 14px; color: #B8CFE5; margin: 14px 0 0;\">💡 רוב ההורים בוחרים בשני הספרים יחד — כלים לפחדים וגם לכעסים<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 4: WORKSHOP -->\n  <div id=\"workshop\" data-screen-label=\"סדנאות\" style=\"background: #EDF3FA; padding: 100px 32px;\">\n    <div style=\"max-width: 720px; margin: 0 auto; text-align: center;\">\n      <div style=\"display: inline-flex; align-items: center; gap: 8px; background: #FFFFFF; border: 1px solid #B8CFE5; color: #3E8E9E; padding: 8px 18px; border-radius: 999px; font-size: 14px; font-weight: 700; margin-bottom: 24px;\">\n        נפתח בקרוב · מספר המקומות מוגבל\n      <\u002Fdiv>\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 32px; color: #2E5C8A; margin: 0 0 16px;\">\n        סדנת טיפול במשחק למטפלים — מחזור 2026\n      <\u002Fh2>\n      <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 40px;\">איך הופכים משחקי קופסה שילדים אוהבים לכלי טיפולי משמעותי? סדנה מעשית לפסיכולוגים, מטפלי CBT ואנשי חינוך. השאירו פרטים — ותהיו הראשונים לדעת כשההרשמה תיפתח!<\u002Fp>\n      <sc-if value=\"{{ !workshopSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #FFFFFF; border-radius: 24px; padding: 32px; box-shadow: 0 12px 32px -18px rgba(46,92,138,0.25); display: flex; flex-direction: column; gap: 16px; max-width: 440px; margin: 0 auto;\">\n          <input type=\"text\" placeholder=\"שם מלא\" value=\"{{ workshopName }}\" sc-camel-on-change=\"{{ onWorkshopNameChange }}\" style=\"font-family: 'Assistant', sans-serif; font-size: 16px; padding: 14px 18px; border: 1px solid #B8CFE5; border-radius: 12px; text-align: right; outline: none;\">\n          <input type=\"text\" placeholder=\"טלפון או מייל\" value=\"{{ workshopContact }}\" sc-camel-on-change=\"{{ onWorkshopContactChange }}\" style=\"font-family: 'Assistant', sans-serif; font-size: 16px; padding: 14px 18px; border: 1px solid #B8CFE5; border-radius: 12px; text-align: right; outline: none;\">\n          <button sc-camel-on-click=\"{{ submitWorkshop }}\" style=\"font-family: 'Assistant', sans-serif; background: #3E8E9E; color: #FFFFFF; font-weight: 600; font-size: 17px; padding: 14px; border: none; border-radius: 999px; cursor: pointer;\">שמרו לי מקום<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ workshopSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #FFFFFF; border-radius: 24px; padding: 40px; max-width: 440px; margin: 0 auto; box-shadow: 0 12px 32px -18px rgba(46,92,138,0.25);\">\n          <p style=\"font-size: 18px; font-weight: 600; color: #2E5C8A; margin: 0;\">תודה! שמרנו לכם מקום ברשימת ההמתנה.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- SECTION 5: LET'S TALK -->\n  <div id=\"contact\" data-screen-label=\"בואו נדבר\" style=\"background: #FDFCFA; padding: 100px 32px;\">\n    <div style=\"max-width: 720px; margin: 0 auto; text-align: center;\">\n      <h2 style=\"font-family: 'Rubik', sans-serif; font-weight: 500; font-size: 32px; color: #2E5C8A; margin: 0 0 16px;\">בואו נדבר<\u002Fh2>\n      <p style=\"font-size: 18px; line-height: 1.7; margin: 0 0 36px;\">אתם מוזמנים להשאיר פרטים — אחזור אליכם לשיחת היכרות קצרה, ונבין יחד מה הכי נכון לכם ולילד/ה.<\u002Fp>\n      <sc-if value=\"{{ !contactSubmitted }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"background: #FFFFFF; border: 1px solid #EDF3FA; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px; max-width: 440px; margin: 0 auto; box-shadow: 0 12px 32px -18px rgba(46,92,138,0.18);\">\n          <input type=\"text\" placeholder=\"שם מלא\" value=\"{{ contactName }}\" sc-camel-on-change=\"{{ onContactNameChange }}\" style=\"font-family: 'Assistant', sans-serif; font-size: 16px; padding: 14px 18px; border: 1px solid #B8CFE5; border-radius: 12px; text-align: right; outline: none;\">\n          <input type=\"text\" placeholder=\"טלפון או מייל\" value=\"{{ contactPhone }}\" sc-camel-on-change=\"{{ onContactPhoneChange }}\" style=\"font-family: 'Assistant', sans-serif; font-size: 16px; padding: 14px 18px; border: 1px solid #B8CFE5; border-radius: 12px; text-align: right; outline: none;\">\n          <textarea placeholder=\"ספרו לי קצת עליכם\" value=\"{{ contactMessage }}\" sc-camel-on-change=\"{{ onContactMessageChange }}\" rows=\"3\" style=\"font-family: 'Assistant', sans-serif; font-size: 16px; padding: 14px 18px; border: 1px solid #B8CFE5; border-radius: 12px; text-align: right; outline: none; resize: none;\"><\u002Ftextarea>\n          <button sc-camel-on-click=\"{{ submitContact }}\" style=\"font-family: 'Assistant', sans-serif; background: #2E5C8A; color: #FFFFFF; font-weight: 600; font-size: 17px; padding: 14px; border: none; border-radius: 999px; cursor: pointer;\">דברו איתי<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ contactSubmitted }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"background: #FFFFFF; border-radius: 24px; padding: 40px; max-width: 440px; margin: 0 auto; box-shadow: 0 12px 32px -18px rgba(46,92,138,0.18);\">\n          <p style=\"font-size: 18px; font-weight: 600; color: #2E5C8A; margin: 0;\">תודה על הפנייה! אחזור אליכם בהקדם.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- FOOTER -->\n  <div data-screen-label=\"פוטר\" style=\"background: #22456A; color: #EDF3FA; padding: 56px 32px 32px;\">\n    <div style=\"max-width: 1120px; margin: 0 auto; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 32px;\">\n      <div>\n        <div style=\"font-family: 'Rubik', sans-serif; font-weight: 600; font-size: 20px; color: #FFFFFF; margin-bottom: 12px;\">רועי ליס<\u002Fdiv>\n        <p style=\"font-size: 15px; line-height: 1.7; color: #B8CFE5; margin: 0; max-width: 280px;\">פסיכולוג חינוכי מומחה, <br>מומחה בטיפול CBT לילדים ונוער<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 15px;\">\n        <span>שפרינצק 3, תל אביב<\u002Fspan>\n        <a href=\"tel:0549107047\" style=\"color: #EDF3FA;\">054-910-7047<\u002Fa>\n        <a href=\"mailto:roee
