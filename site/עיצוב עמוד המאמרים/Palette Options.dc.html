<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Assistant:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <meta name="design_doc_mode" content="canvas">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    img.art-img { display:block; width:100%; height:100%; object-fit:cover; }
    .mini-card { border-radius:16px; overflow:hidden; display:flex; }
  </style>
</helmet>

<div dir="rtl" style="min-height:100vh; background:#EDEAE3; padding:56px 40px; font-family:'Assistant',sans-serif;">

  <div style="max-width:1640px; margin:0 auto;">
    <div style="display:flex; align-items:baseline; gap:14px; margin-bottom:34px; padding-inline:8px; flex-wrap:wrap;">
      <h2 style="font-family:'Heebo',sans-serif; font-weight:800; font-size:20px; color:#2C2722; margin:0;">פלטות צבע — בחרו כיוון</h2>
      <span style="font-family:'Assistant',sans-serif; font-size:15px; color:#857B6E;">כל פלטה על אותו עיצוב · אמרו לי מספר (2a / 2b / 2c / 2d) ואחיל אותו על העמוד</span>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:40px; align-items:flex-start;">
      <sc-for list="{{ palettes }}" as="p" hint-placeholder-count="4">
        <div id="{{ p.id }}" style="width:380px; flex:0 0 auto;">
          <div style="display:flex; align-items:center; gap:10px; margin-bottom:14px;">
            <span style="font-family:'Heebo',sans-serif; font-weight:800; font-size:14px; color:#fff; background:{{ p.accent }}; border-radius:999px; padding:5px 14px;">{{ p.id }}</span>
            <span style="font-family:'Assistant',sans-serif; font-weight:700; font-size:15px; color:#5C534A;">{{ p.name }}</span>
          </div>

          <div style="background:{{ p.pageBg }}; border-radius:22px; padding:20px; box-shadow:0 24px 48px -28px rgba(48,40,30,.4);">
            <!-- swatches -->
            <div style="display:flex; gap:8px; margin-bottom:18px;">
              <span style="width:34px; height:34px; border-radius:8px; background:{{ p.accent }};"></span>
              <span style="width:34px; height:34px; border-radius:8px; background:{{ p.pageBg }}; border:1px solid rgba(0,0,0,.08);"></span>
              <span style="width:34px; height:34px; border-radius:8px; background:{{ p.cardBg }}; border:1px solid rgba(0,0,0,.08);"></span>
              <span style="width:34px; height:34px; border-radius:8px; background:{{ p.tagBg }}; border:1px solid rgba(0,0,0,.06);"></span>
            </div>

            <!-- mini header -->
            <div style="border-radius:16px; overflow:hidden; margin-bottom:16px;">
              <div style="padding:22px 22px 26px; background:linear-gradient(180deg,{{ p.accent }} 0%, {{ p.accent }} 58%, transparent 58%);">
                <h1 style="font-family:'Heebo',sans-serif; font-weight:900; font-size:34px; line-height:1; color:{{ p.onAccent }}; margin:0 0 14px;">מאמרים</h1>
                <div style="background:{{ p.cardBg }}; border-radius:12px; padding:12px 14px;">
                  <p style="font-family:'Assistant',sans-serif; font-weight:500; font-size:12.5px; line-height:1.5; color:{{ p.bodyText }}; margin:0;">אוסף המאמרים, המחקרים והפרסומים שכתבתי לאורך השנים.</p>
                </div>
              </div>
            </div>

            <!-- mini card -->
            <div class="mini-card" style="background:{{ p.cardBg }}; border:1px solid {{ p.cardBorder }};">
              <div style="width:104px; flex:0 0 auto; background:{{ p.tagBg }};">
                <img class="art-img" src="https://roeeliss.co.il/wp-content/uploads/2023/03/shutterstock_1035252172-copy-1.jpg" alt="">
              </div>
              <div style="flex:1; min-width:0; padding:14px 16px;">
                <span style="display:inline-block; font-family:'Heebo',sans-serif; font-weight:700; font-size:10.5px; color:{{ p.accent }}; background:{{ p.tagBg }}; border-radius:999px; padding:3px 10px; margin-bottom:9px;">טיפול CBT</span>
                <h3 style="font-family:'Heebo',sans-serif; font-weight:700; font-size:14.5px; line-height:1.3; color:{{ p.heading }}; margin:0 0 8px;">לשחק CBT: טיפול באמצעות משחק</h3>
                <span style="display:inline-flex; align-items:center; gap:6px; font-family:'Heebo',sans-serif; font-weight:700; font-size:11.5px; color:{{ p.accent }}; background:{{ p.ctaBg }}; border-radius:999px; padding:6px 13px;">לקריאה
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" style="transform:scaleX(-1);"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </span>
              </div>
            </div>
          </div>
        </div>
      </sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const palettes = [
      {
        id: "2a", name: "טרקוטה חמים",
        pageBg: "#F1E7DA", accent: "#C4713F", onAccent: "#FBF3E9",
        cardBg: "#FCF6EE", cardBorder: "#EBDFCE", tagBg: "#F5E3D5",
        heading: "#3A2C20", bodyText: "#5B4A3B", ctaBg: "#F3E4D6"
      },
      {
        id: "2b", name: "אפרסק רך",
        pageBg: "#F7ECE6", accent: "#DE8A6B", onAccent: "#FFF7F2",
        cardBg: "#FFF8F4", cardBorder: "#F2E1D8", tagBg: "#FBE5DA",
        heading: "#40302A", bodyText: "#6B564D", ctaBg: "#FBE9E0"
      },
      {
        id: "2c", name: "כחול-ים רגוע",
        pageBg: "#E4ECEC", accent: "#3F7E8C", onAccent: "#F1F8F8",
        cardBg: "#F8FBFB", cardBorder: "#D9E6E6", tagBg: "#DCEBEC",
        heading: "#25373B", bodyText: "#4E6266", ctaBg: "#E4F0F0"
      },
      {
        id: "2d", name: "דבש וחרדל",
        pageBg: "#F2EBDA", accent: "#C79A3C", onAccent: "#FCF7EA",
        cardBg: "#FCF8EE", cardBorder: "#EAE0C9", tagBg: "#F3E8CE",
        heading: "#3B3320", bodyText: "#5E5539", ctaBg: "#F4EAD2"
      }
    ];
    return { palettes };
  }
}
</script>
</body>
</html>
